# Replaces /usr/lib/systemd/system/rc-local.service.d/debian.conf - a drop-in
# of the same name in /etc wins over the one in /usr/lib - which orders
# rc.local after network-online.target. getty@tty1 is ordered after rc.local,
# so on this image the console login (and with it the autologin and the
# desktop) waited for the network to come up, five seconds of nothing on a
# machine with no interfaces configured. Nothing in this image's rc.local
# touches the network; the unit itself is overridden alongside as well.
#
# The other half of Debian's drop-in is kept: rc.local's output belongs on
# the console as well as in the journal.
[Service]
StandardOutput=journal+console
StandardError=journal+console
