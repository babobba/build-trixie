# Configuration for mklive trixie, openbox, booting with systemd.
#
# This is default.conf with SYSTEMD="TRUE". Everything downstream of that flag
# already existed in build-trixie but no shipped config ever set it, so this is
# the first configuration that exercises it.
#
# What the flag changes, all of it in build-trixie:
#
#   - debootstrap runs against Debian trixie instead of Devuan excalibur
#   - no Devuan repository is added and /etc/apt/preferences.d/99devuan is not
#     written, so nothing pins the Devuan forks over Debian's packages
#   - /etc/apt/preferences.d/00systemd is removed - that file pins *systemd* to
#     -1, which is how the Devuan build keeps it out
#   - systemd systemd-sysv libpam-systemd udev are installed in place of
#     sysvinit-core initscripts elogind libpam-elogind eudev
#   - xlibre comes from its debian/ suite rather than its devuan/ one
#
# The resulting image is Debian 13 trixie with systemd as PID 1. It must be
# booted with the initrd from this branch: initrd-src/linuxrc here targets
# systemd only and will drop to a shell on a sysvinit union, exactly as the
# stock initrd would produce a system with no working cheatcodes on a systemd
# one. The two go together.
#
# NOTE: Leave every commented (#) line commented as it is
# See at the bottom commented out for info

### Start configuration

# Be careful with removing from this section (mostly essential)
# sysvinit-core is deliberately absent - build-trixie strips it when
# SYSTEMD=TRUE, but a config that asks for it and a build that removes it is a
# contradiction someone will eventually try to resolve the wrong way.
BASE_INSTALL="rfkill bc util-linux-extra e2fsprogs wget iputils-ping dash net-tools ifupdown wireless-tools xserver-xorg-core xserver-xorg psmisc fuse3 x11-utils x11-xserver-utils dbus-x11 busybox sudo mawk xinit xterm pciutils usbutils file rsync dosfstools alsa-utils pm-utils xdotool wmctrl desktop-file-utils xdg-utils media-types cryptsetup-bin squashfs-tools fakeroot xserver-xorg-input-evdev pv xserver-xorg-input-synaptics ntfs-3g nano xserver-xorg-video-intel acpid curl gettext-base fdisk mtools wpasupplicant gpgv xserver-xorg-legacy"

# Base Dog Packages, recommended to keep:
# yad gtkdialog obshutdown pup-volume-monitor peasywifi chpupsocket
BASE_DOG_APPS_INSTALL="yad gtkdialog obshutdown pup-volume-monitor peasywifi chpupsocket edit-sfs-pcmanfm filemnt-pcmanfm remaster-scripts quick-remaster apt2sfs sfsload fixdepinstall greybird-theme-dd-stretch makedebpackage sound-card-selector alsamixer-tray"

BASE_APPS_INSTALL="leafpad gparted parted viewnior firefox-esr pfind conky alsa-ucm-conf"

DESK_APPS_INSTALL="openbox obconf pcmanfm lxpanel lxrandr lxinput lxappearance libfm-modules gsettings-desktop-schemas"

FIRMWARE="firmware-linux-free"

EXTRA_DOG_APPS_INSTALL="peasyclock pack-it repo-conf upgrade-kernel"

# Packages that ship as a squashfs module of their own (live/05-<name>.squashfs,
# loaded automatically) instead of inside the base: Firefox is 28% of the base
# and the one thing a user is most likely to leave off a small medium.
MODULE_PACKAGES="firefox-esr"

REM_AUTO_INST="TRUE"

# Info, set to TRUE if preferred 'yes'
FORCE32="FALSE"  # Make a 32-bit system ?
KEEPLOCALES="FALSE"  # Keep locale files that are included in packages ?
KEEPMANDOC="FALSE"  # Keep man/doc files ?
SYSTEMD="TRUE"  # Make a system booting with systemd ?
RUNXTERM="FALSE"  # Run Xterm after the install process ?
LBINITRD="FALSE"  # Generate an initrd for "live-boot" ? (initrd.img)
ISOUEFI="TRUE"  # Create ISO with UEFI support ?

### End configuration

# Login on this image comes from the overlay's own
# /etc/systemd/system/getty@tty1.service, which runs "agetty --noclear -a root"
# and is enabled into getty.target and graphical.target. /etc/profile then runs
# startx. The login= and nologin cheatcodes write a drop-in over that unit
# rather than editing /etc/inittab, which does nothing here.
#
# A selection of firmware packages available (mostly for wireless):
# atmel-firmware firmware-realtek firmware-mediatek bluez-firmware firmware-atheros firmware-linux-free firmware-linux-nonfree firmware-netxen firmware-ti-connectivity firmware-b43legacy-installer firmware-iwlwifi firmware-ipw2x00 firmware-libertas firmware-intelwimax firmware-brcm80211 firmware-b43-installer firmware-qlogic firmware-bnx2 firmware-misc-nonfree firmware-bnx2x firmware-zd1211
# Some extra dog applications:
# debdoginstallscripts dogradio youtube-get3 straw-viewer peasyfwmon upgrade-kernel redshiftgui mpv peasymount peasyscale peasyxorburn peasyglue
# Choice of Desktop:
# Default is openbox with pcmanmfm providing the desktop, lxpanel, etc..
# To change, replace what is in the DESK_APPS_INSTALL field with for example:
# mate-core (for MATE), xfce4 (for XFCE), lxde (for LXDE)
# No guarantee that all work as expected, might require some fixing
# Remove automatically installed packages:
# During installing all the packages, some are installed that you might not need, e.g.
# cpp, REM_AUTO_INST=TRUE will uninstall it.
# (dependencies will then be autoremoved, depending on your other package choices)
# To force 32 bit build on a 64 bit OS set FORCE32=TRUE
